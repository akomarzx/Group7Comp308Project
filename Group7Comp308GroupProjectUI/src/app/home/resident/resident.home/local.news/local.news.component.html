<mat-toolbar color="primary" class="d-flex justify-content-between">
  <span>Local News & Discussions</span>
  <button mat-raised-button (click)="onAddNewsClicked()">
    <mat-icon>add</mat-icon>
    Add News
  </button>
</mat-toolbar>
<div class="container">
  @for (item of this.postsSignal(); track $index) {
  <mat-card class="post-card">
    <mat-card-header>
      <mat-card-title>{{ item.title }}</mat-card-title>
      <mat-card-subtitle>by {{ item.user }} •
        {{ item.timestamp | date : "short" }}</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <p>{{ item.content }}</p>
    </mat-card-content>
  </mat-card>
  }
</div>
