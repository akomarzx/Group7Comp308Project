<mat-card class="form-card p-3">
  <mat-card-title class="my-2">New Discussion</mat-card-title>
  <mat-card-content>
    <form [formGroup]="postForm" (ngSubmit)="onSubmit()">
      <mat-form-field class="full-width">
        <mat-label>Title</mat-label>
        <input matInput formControlName="title" />
        @if (postForm.get('title')?.hasError('required')) {
        <mat-error>Title is required</mat-error>
        }
      </mat-form-field>

      <mat-form-field class="full-width">
        <mat-label>Message</mat-label>
        <textarea matInput rows="4" formControlName="content"></textarea>
        @if (postForm.get('content')?.hasError('required')) {
        <mat-error>Message is required</mat-error>
        }
      </mat-form-field>
      <button
        mat-raised-button
        color="primary"
        type="submit"
        [disabled]="postForm.invalid"
      >
        Post
      </button>
    </form>
  </mat-card-content>
</mat-card>
