<mat-card class="form-card p-3">
  <mat-card-title class="my-2">New Emergency Alert</mat-card-title>
  <mat-card-content>
    <form [formGroup]="alertForm" (ngSubmit)="onSubmit()">
      <mat-form-field class="full-width">
        <mat-label>Title</mat-label>
        <input matInput formControlName="title" />
        @if (alertForm.get('title')?.hasError('required')) {
        <mat-error>Title is required</mat-error>
        }
      </mat-form-field>

      <mat-form-field class="full-width">
        <mat-label>Location</mat-label>
        <input matInput formControlName="location" />
        @if (alertForm.get('location')?.hasError('required')) {
        <mat-error>Location is required</mat-error>
        }
      </mat-form-field>

      <button
        mat-raised-button
        color="warn"
        type="submit"
        [disabled]="alertForm.invalid"
      >
        Submit Alert
      </button>
    </form>
  </mat-card-content>
</mat-card>
