<mat-toolbar color="primary" class="d-flex justify-content-between">
    <span>Emergency Alerts</span>
    @if (this.authService.isAuthorized("RESIDENT")) {
      <button mat-raised-button (click)="onAddAlert()">
        <mat-icon>add</mat-icon>
        Add Alert
      </button>
    }
  </mat-toolbar>
  
  <div class="mt-3 pe-3">
    <div class="row gy-2 d-flex">
      @for (item of this.allAlerts(); track $index) {
        <div class="col-12 col-sm-6 col-md-4 col-lg-3 d-flex">
          <mat-card class="post-card flex-fill error-card">
            <mat-card-header>
              <mat-card-title>{{ item.title }}</mat-card-title>
              <mat-card-subtitle>by {{ item.username }} •
                {{ item.timestamp | date : "short" }}</mat-card-subtitle>
            </mat-card-header>
            <mat-card-content>
              <p>{{ item.title }}</p>
            </mat-card-content>
          </mat-card>
        </div>
      }
    </div>
  </div>
